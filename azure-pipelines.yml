# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger: none

pool:
  vmImage: ubuntu-latest

# variables:
#   BUILD_NAME: 'is-number-npm-build'
#   BUILD_NUMBER: '$(Build.BuildId)'

steps:
# 1. Disable default checkout
- checkout: none

# 2. Clone minimal npm project explicitly
- script: |
    git clone https://github.com/jonschlinkert/is-number.git
    cd is-number
    echo "Cloned repo contents:"
    ls
  displayName: 'Clone minimal npm project (is-number)'

# 3. JFrog npm install
- task: JFrogNpm@1
  displayName: 'JFrog npm install'
  inputs:
    command: 'install'
    artifactoryConnection: 'kanishk-connect'
    sourceRepo: 'npm-virtual'
    workingFolder: 'is-number'
    # collectBuildInfo: true
    # buildName: '$(BUILD_NAME)'
    # buildNumber: '$(BUILD_NUMBER)'

